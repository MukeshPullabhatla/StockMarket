services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - DB_PATH=/data/app.db
      - CORS_ORIGINS=*
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
